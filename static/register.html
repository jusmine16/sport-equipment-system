<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Sport Equipment Borrowing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); }
  </style>
</head>
<body class="min-h-screen gradient-bg flex items-center justify-center p-4" x-data="registerApp()">
  <div class="w-full max-w-md">
    <div class="bg-slate-800/80 backdrop-blur rounded-2xl shadow-2xl border border-slate-700/50 p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-amber-400">Create Account</h1>
        <p class="text-slate-400 mt-1">Sport Equipment Borrowing System</p>
      </div>

      <form @submit.prevent="submit" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
          <input type="text" x-model="username" required
            class="w-full px-4 py-2.5 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-amber-500/50 outline-none transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
          <input type="email" x-model="email"
            class="w-full px-4 py-2.5 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-amber-500/50 outline-none transition">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">First Name</label>
            <input type="text" x-model="first_name"
              class="w-full px-4 py-2.5 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-amber-500/50 outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Last Name</label>
            <input type="text" x-model="last_name"
              class="w-full px-4 py-2.5 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-amber-500/50 outline-none transition">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <input type="password" x-model="password" required minlength="8"
            class="w-full px-4 py-2.5 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-amber-500/50 outline-none transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Confirm Password</label>
          <input type="password" x-model="password_confirm" required minlength="8"
            class="w-full px-4 py-2.5 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-amber-500/50 outline-none transition">
        </div>

        <div x-show="error" x-transition class="p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-400 text-sm" x-text="error"></div>
        <div x-show="success" x-transition class="p-3 bg-emerald-500/20 border border-emerald-500/50 rounded-lg text-emerald-400 text-sm" x-text="success"></div>

        <button type="submit" :disabled="loading"
          class="w-full py-3 bg-amber-500 hover:bg-amber-600 disabled:bg-amber-500/50 text-slate-900 font-semibold rounded-lg transition">
          <span x-show="!loading">Register</span>
          <span x-show="loading">Creating account...</span>
        </button>
      </form>

      <p class="mt-6 text-center text-slate-500 text-sm">
        Already have an account? <a href="login.html" class="text-amber-400 hover:underline">Login</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    function registerApp() {
      return {
        username: '', email: '', first_name: '', last_name: '', password: '', password_confirm: '',
        error: '', success: '', loading: false,
        async submit() {
          this.error = '';
          this.success = '';
          if (this.password !== this.password_confirm) {
            this.error = 'Passwords do not match';
            return;
          }
          this.loading = true;
          try {
            await register({
              username: this.username,
              email: this.email,
              first_name: this.first_name,
              last_name: this.last_name,
              password: this.password,
              password_confirm: this.password_confirm
            });
            this.success = 'Account created! Redirecting to login...';
            setTimeout(() => window.location.href = 'login.html', 1500);
          } catch (e) {
            const d = e.data || {};
            this.error = d.username?.[0] || d.password?.[0] || d.email?.[0] || e.message || 'Registration failed';
          } finally {
            this.loading = false;
          }
        }
      };
    }
  </script>
</body>
</html>
